[workspace]
resolver = "2"
members = [
    "lib",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["nautilus-mcp Contributors"]

[workspace.dependencies]
# Concurrency
crossbeam = "0.8"
parking_lot = "0.12"

# Encoding
base64 = "0.22"
png = "0.17"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UniFFI
uniffi = "0.28"
